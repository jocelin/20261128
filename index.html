    ['tag','d','m1','m2','ic','pl'].forEach(function(k){if(cfg[k])p.push(k+'='+encodeURIComponent(cfg[k]))});

  var pn=document.getElementById('pn'),inT=document.getElementById('inT'),inD=document.getElementById('inD'),in1=document.getElementById('in1'),in2=document.getElementById('in2'),inI=document.getElementById('inI'),inP=document.getElementById('inP'),ln=document.getElementById('ln'),msg=document.getElementById('msg');

  document.getElementById('cp').addEventListener('click',function(){var u=link();
    if(navigator.share){navigator.share({title:'台北換你翻',url:u}).catch(function(){})}
    else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(function(){msg.textContent='已複製連結'},function(){ln.select();msg.textContent='請長按選取後複製'})}
    else{ln.select();msg.textContent='請長按選取後複製'}});
  ln.addEventListener('focus',function(){ln.select()});
  for(var i2=0;i2<btns.length;i2++)btns[i2].addEventListener('click',function(){if(pn.style.display==='block')refresh()});
  function fit(){bg.setAttribute('preserveAspectRatio',innerHeight>innerWidth?'xMaxYMax slice':'xMidYMax slice');
    var vh=document.getElementById('sky').clientHeight||innerHeight,sc=Math.max(innerWidth/1200,vh/800),topv=800-vh/sc,k=Math.max(.4,Math.min(1,(640-Math.max(topv,0)-40)/(640-66)));
    document.getElementById('t101').setAttribute('transform','translate(1085 640) scale('+k+') translate(-1085 -640)')}
  addEventListener('resize',function(){fit();fitText()});fit();


  var routeOn=false,rp=document.getElementById('rp'),rsvg=document.getElementById('route'),plane=document.querySelector('.plane'),pathLen=0,t0=0;
  function fitIcon(){var ice=document.getElementById('ic');ice.style.width='';ice.style.fontSize='';ice.style.top='';
    if(ice.style.display!=='block')return;
    var bc=[].slice.call(document.querySelectorAll('.bc')).filter(function(e){return getComputedStyle(e).display!=='none'&&e.style.visibility!=='hidden'})[0];if(!bc)return;
    var f=ice.getBoundingClientRect(),r=bc.getBoundingClientRect();
    function ov(a,b){return a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top}
    if(!ov(f,r))return;
    var w=Math.max(56,r.left-f.left-10);ice.style.width=w+'px';ice.style.fontSize=(w*.9)+'px';
    f=ice.getBoundingClientRect();
    if(ov(f,r)){var t=r.top-f.height-6;ice.style.top=Math.max(4,t)+'px';f=ice.getBoundingClientRect();

  function layoutRoute(){
    fitIcon();
    var ice=document.getElementById('ic'),hasIc=ice&&ice.style.display==='block',on=(typeof cfg!=='undefined')&&plOn(cfg);
    routeOn=!!on;rsvg.style.display=on?'block':'none';plane.classList.remove('free');plane.style.display=on?'':'none';
    if(!on){plane.style.transform='';return}
    var f=hasIc?ice.getBoundingClientRect():{left:-30,right:-30,top:Math.min(innerHeight*.1,90),height:0},t=document.getElementById('t101').getBoundingClientRect(),W=innerWidth,H=innerHeight;
    var x1=hasIc?f.right+4:-20,y1=f.top+f.height*.4,x2=(t.left+t.right)/2,y2=t.top+6,top=Math.max(8,Math.min(y1,y2)-H*.07);
    rp.setAttribute('d','M'+x1+' '+y1+' C '+(x1+(x2-x1)*.2)+' '+top+', '+(x1+(x2-x1)*.8)+' '+top+', '+x2+' '+y2);
    var sw=Math.max(3,Math.min(W,H)*.007);rp.setAttribute('stroke-width',sw);rp.setAttribute('stroke-dasharray',(sw*1.2)+' '+(sw*3));
    pathLen=rp.getTotalLength()}
  function tick(ts){
    if(routeOn&&pathLen){
      var D=4200,P=700,e=(ts-t0)%(D+P),u=Math.min(1,e/D);u=u*u*(3-2*u);

      plane.style.transform='translate('+(p.x-w/2)+'px,'+(p.y-h/2)+'px) rotate('+ang+'deg)';
      plane.style.opacity=e>D?0:1}
    requestAnimationFrame(tick)}
  var _apply=apply;apply=function(c){_apply(c);layoutRoute()};
  addEventListener('resize',function(){setTimeout(layoutRoute,50)});
  setTimeout(function(){layoutRoute();requestAnimationFrame(function(ts){t0=ts;tick(ts)})},100);
  var fs=document.getElementById('fs'),ctl=document.getElementById('ctl'),de=document.documentElement,rq=de.requestFullscreen||de.webkitRequestFullscreen;

  }
})();
